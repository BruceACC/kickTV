{% extends "base.html" %}

{% block title %}Historial{% endblock %}
{% block page_title %}Historial de Reproducción{% endblock %}

{% block content %}
<div class="page-content">
    <div class="card glass-card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="card-title mb-0"><i class="bi bi-clock-history"></i> Historial</h2>
                <span class="badge bg-primary fs-6" id="history-total">0 reproducciones</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom" id="history-table">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Categoría</th>
                            <th>Proveedor</th>
                            <th>Duración</th>
                            <th>Reproducido</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-clock fs-1 d-block mb-2"></i>
                                Sin historial
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <nav>
                    <ul class="pagination pagination-sm" id="history-pagination"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let historyPage = 0;
const PAGE_SIZE = 25;

document.addEventListener('DOMContentLoaded', () => loadHistory(0));

async function loadHistory(offset) {
    try {
        const resp = await fetch(`/api/history?limit=${PAGE_SIZE}&offset=${offset}`);
        const data = await resp.json();
        const items = data.data?.items || [];
        const total = data.data?.total || 0;
        const tbody = document.getElementById('history-body');
        document.getElementById('history-total').textContent = `${total} reproducciones`;

        if (items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5">
                <i class="bi bi-clock fs-1 d-block mb-2"></i>Sin historial</td></tr>`;
            return;
        }

        tbody.innerHTML = items.map(item => `
            <tr>
                <td class="fw-medium">${escapeHtml(item.title || 'Sin título')}</td>
                <td>${escapeHtml(item.author || '—')}</td>
                <td><span class="category-badge">${item.category || '—'}</span></td>
                <td><span class="provider-badge provider-${item.provider}">${item.provider || '—'}</span></td>
                <td>${formatDuration(item.duration || 0)}</td>
                <td>${new Date(item.played_at).toLocaleString('es')}</td>
            </tr>
        `).join('');

        // Pagination
        const totalPages = Math.ceil(total / PAGE_SIZE);
        const currentPage = Math.floor(offset / PAGE_SIZE);
        const pag = document.getElementById('history-pagination');
        let html = '';
        for (let i = 0; i < Math.min(totalPages, 10); i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadHistory(${i * PAGE_SIZE}); return false;">${i + 1}</a>
            </li>`;
        }
        pag.innerHTML = html;

    } catch (e) {
        console.error('Error loading history:', e);
    }
}
</script>
{% endblock %}
