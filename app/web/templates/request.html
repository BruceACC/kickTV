<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KickTV Queen - Peticiones Automáticas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        .header h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(56, 189, 248, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.5);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-type {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 800;
        }

        /* Modal Styles */
        #tv-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-content h2 { margin-top: 0; color: #38bdf8; }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .form-row div { flex: 1; }
        
        .modal-content label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-inject {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-inject:hover { opacity: 0.9; }

        /* Queue Viewer */
        .queue-container {
            width: 100%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .queue-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #e2e8f0;
        }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom scrollbar */
        .queue-list::-webkit-scrollbar { width: 6px; }
        .queue-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .queue-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .queue-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
        }
        
        .queue-item.is-movie {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .queue-item-index {
            font-weight: 800;
            color: #94a3b8;
            margin-right: 15px;
            min-width: 20px;
        }

        .queue-item-title {
            font-weight: 600;
            font-size: 0.95rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-item-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: #334155;
            color: #cbd5e1;
            margin-left: 10px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .queue-item.is-movie .queue-item-badge {
            background: #0ea5e9;
            color: white;
        }

        .queue-item-provider {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            margin-left: 5px;
            text-transform: capitalize;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .provider-youtube { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
        .provider-tiktok { color: #2dd4bf; border-color: rgba(45, 212, 191, 0.3); }
        .provider-instagram { color: #c084fc; border-color: rgba(192, 132, 252, 0.3); }
        .provider-local { color: #facc15; border-color: rgba(250, 204, 21, 0.3); }

        #toast {
            position: fixed;
            bottom: -100px;
            background: #10b981;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: bottom 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 200;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }

        .loader {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #38bdf8;
            animation: spin 1s ease-in-out infinite;
            position: absolute;
            right: 20px;
            top: 18px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .spin-disc {
            animation: spin 3s linear infinite;
            opacity: 1 !important;
            box-shadow: 0 0 20px #53ff45 !important;
        }

        .kick-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 3s ease-in-out infinite;
        }

        .kick-logo-container:nth-child(3) {
            animation-delay: 1.5s;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .kick-neon-text {
            color: #53ff45;
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-shadow: 0 0 5px #53ff45, 0 0 10px #53ff45, 0 0 20px #10b981;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .kick-logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #53ff45;
            box-shadow: 0 0 15px rgba(83, 255, 69, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .kick-logo-img:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(83, 255, 69, 0.8);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="kick-logo-container">
            <div class="kick-neon-text">kick</div>
            <a href="https://kick.com/craulox" target="_blank">
                <img src="/static/kick-logos/CRaulox.webp" alt="CRaulox" class="kick-logo-img">
            </a>
        </div>
        <div>
            <h1>KickTV Queen</h1>
            <p style="color: #94a3b8; font-size: 1.1rem; margin: 5px 0 0 0;">Buscador automático de Películas y Series</p>
            <a href="/vip" style="display: inline-block; margin-top: 15px; padding: 10px 20px; background: linear-gradient(135deg, #10b981, #53ff45); color: black; font-weight: bold; border-radius: 20px; text-decoration: none; box-shadow: 0 4px 15px rgba(83,255,69,0.3);">👑 Acceso VIP</a>
        </div>
        <div class="kick-logo-container">
            <div class="kick-neon-text">kick</div>
            <a href="https://kick.com/tototooony" target="_blank">
                <img src="/static/kick-logos/TOTOTOOONY.webp" alt="TOTOTOOONY" class="kick-logo-img">
            </a>
        </div>
    </div>

    <div class="queue-container">
        <div class="queue-header">
            <h2>Cola de Reproducción</h2>
            <span id="queue-count" style="color: #94a3b8; font-size: 0.9rem;">Cargando...</span>
        </div>
        <div class="queue-list" id="queue-list">
            <!-- Queue items inject here -->
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Ej: Avengers Endgame, Breaking Bad..." autocomplete="off">
        <div class="loader" id="loader"></div>
    </div>

    <div class="results-grid" id="results">
        <!-- Results inject here -->
    </div>

    <!-- TV Show Modal -->
    <div id="tv-modal">
        <div class="modal-content">
            <h2 id="modal-title">Serie Seleccionada</h2>
            <p style="color: #94a3b8; margin-top: -10px; margin-bottom: 20px;">Indica el episodio a reproducir</p>
            
            <div class="form-row">
                <div>
                    <label>Temporada</label>
                    <input type="number" id="tv-season" value="1" min="1">
                </div>
                <div>
                    <label>Episodio</label>
                    <input type="number" id="tv-episode" value="1" min="1">
                </div>
            </div>
            
            <button class="btn-inject" onclick="injectTvShow()">Inyectar Serie</button>
            <button style="background: transparent; border: none; color: #94a3b8; margin-top: 15px; cursor: pointer;" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <div id="toast">✅ Inyectado correctamente en KickTV</div>

    <script>
        const input = document.getElementById('search-input');
        const resultsDiv = document.getElementById('results');
        const loader = document.getElementById('loader');
        const queueList = document.getElementById('queue-list');
        const queueCount = document.getElementById('queue-count');
        let timeout = null;
        let selectedTvShow = null;

        // Auto-refresh queue every 5 seconds
        function fetchQueue() {
            fetch('/api/queue')
                .then(res => res.json())
                .then(data => {
                    if(data.success) renderQueue(data.queue, data.size);
                })
                .catch(err => console.error("Error fetching queue:", err));
        }

        function renderQueue(queue, size) {
            queueCount.innerText = `${size} videos`;
            queueList.innerHTML = '';
            
            if (queue.length === 0) {
                queueList.innerHTML = `<p style="color: #64748b; font-size: 0.9rem; text-align: center;">La cola está vacía.</p>`;
                return;
            }

            queue.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = `queue-item ${item.is_iframe ? 'is-movie' : ''}`;
                
                const badgeText = item.is_iframe ? 'Cine' : item.category;
                const providerText = item.is_iframe ? 'Premium' : item.provider;
                
                el.innerHTML = `
                    <div class="queue-item-index">${index + 1}</div>
                    <div class="queue-item-title" title="${item.title}">${item.title}</div>
                    <div class="queue-item-provider provider-${item.provider}">${providerText}</div>
                    <div class="queue-item-badge">${badgeText}</div>
                `;
                queueList.appendChild(el);
            });
        }

        // Initial fetch and interval
        fetchQueue();
        setInterval(fetchQueue, 5000);

        input.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            loader.style.display = 'block';
            timeout = setTimeout(() => {
                fetch(`/api/tmdb/search?query=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        loader.style.display = 'none';
                        if(data.success) {
                            renderResults(data.results);
                        } else {
                            resultsDiv.innerHTML = `<p style="color: #ef4444; text-align: center; width: 100%;">Error en TMDB (Falta API Key?)</p>`;
                        }
                    })
                    .catch(err => {
                        loader.style.display = 'none';
                        console.error(err);
                    });
            }, 500); // 500ms debounce
        });

        function renderResults(results) {
            resultsDiv.innerHTML = '';
            if (results.length === 0) {
                resultsDiv.innerHTML = `<p style="color: #94a3b8; text-align: center; width: 100%;">No se encontraron resultados.</p>`;
                return;
            }

            results.forEach(item => {
                const isTv = item.media_type === 'tv';
                const isAnime = item.original_language === 'ja' && item.genre_ids && item.genre_ids.includes(16);
                const title = isTv ? item.name : item.title;
                const poster = item.poster_path 
                    ? `https://image.tmdb.org/t/p/w300${item.poster_path}` 
                    : 'https://via.placeholder.com/300x450/1e293b/475569?text=Sin+Portada';
                
                let typeText = isTv ? '📺 Serie' : '🎬 Película';
                let typeColor = isTv ? '#c084fc' : '#38bdf8';
                if (isAnime) {
                    typeText = '🎌 Anime';
                    typeColor = '#f43f5e';
                }
                
                const dateStr = item.release_date || item.first_air_date || '';
                let statusLabel = '';
                let borderStyle = 'border: 2px solid #10b981;'; // Default green for released
                item.isFuture = false;
                
                if (dateStr) {
                    const releaseDate = new Date(dateStr);
                    const now = new Date();
                    const diffTime = now - releaseDate;
                    const diffDays = diffTime / (1000 * 60 * 60 * 24);
                    
                    if (releaseDate.getFullYear() > now.getFullYear()) {
                        statusLabel = '<span style="background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-left: 5px;">En desarrollo</span>';
                        borderStyle = 'border: 2px solid #ef4444;';
                        item.isFuture = true;
                    } else if (releaseDate > now) {
                        statusLabel = '<span style="background: #f59e0b; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-left: 5px;">Próximo estreno</span>';
                        borderStyle = 'border: 2px solid #f59e0b;';
                        item.isFuture = true;
                    } else if (diffDays >= 0 && diffDays <= 45) {
                        statusLabel = '<span style="background: #a855f7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-left: 5px;">Proceso-ANUNCIO</span>';
                        borderStyle = 'border: 2px solid #a855f7;';
                        item.isFuture = true;
                    }
                }
                
                const card = document.createElement('div');
                card.className = 'card';
                card.style.cssText = borderStyle;
                card.onclick = () => handleSelect(item);
                
                card.innerHTML = `
                    <img src="${poster}" alt="Poster">
                    <div class="card-info">
                        <div class="card-type" style="color: ${typeColor}">${typeText}</div>
                        <h3 class="card-title">${title}</h3>
                        <div style="color: #64748b; font-size: 0.8rem; display: flex; align-items: center;">${dateStr.split('-')[0]}${statusLabel}</div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function handleSelect(item) {
            const isTv = item.media_type === 'tv';
            const title = isTv ? item.name : item.title;
            
            if (item.isFuture) {
                injectTrailerRequest(title);
                return;
            }
            
            if (isTv) {
                selectedTvShow = item;
                document.getElementById('modal-title').innerText = item.name;
                document.getElementById('tv-modal').style.display = 'flex';
            } else {
                // It's a movie, inject directly
                injectRequest({
                    tmdb_id: String(item.id),
                    is_tv: false,
                    title: title
                });
            }
        }

        function closeModal() {
            document.getElementById('tv-modal').style.display = 'none';
            selectedTvShow = null;
        }

        function injectTvShow() {
            if (!selectedTvShow) return;
            const s = parseInt(document.getElementById('tv-season').value);
            const e = parseInt(document.getElementById('tv-episode').value);
            
            injectRequest({
                tmdb_id: String(selectedTvShow.id),
                is_tv: true,
                title: `${selectedTvShow.name} (T${s}E${e})`,
                season: s,
                episode: e
            });
            
            closeModal();
        }

        function injectRequest(payload) {
            fetch('/api/queue/inject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast(`✅ ${payload.title} fue enviada a la transmisión.`);
                    input.value = '';
                    resultsDiv.innerHTML = '';
                    fetchQueue(); // refresh queue immediately
                } else {
                    alert("Error: " + JSON.stringify(data));
                }
            })
            .catch(err => alert("Error de red inyectando: " + err));
        }

        function injectTrailerRequest(title) {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            
            fetch('/api/queue/inject_trailer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title })
            })
            .then(res => res.json())
            .then(data => {
                loader.style.display = 'none';
                if(data.success) {
                    closeModal();
                    alert("¡Tráiler añadido a la cola con éxito!");
                    fetchQueue(); // refresh queue
                } else {
                    alert(data.detail || "Error al añadir el tráiler");
                }
            })
            .catch(err => {
                loader.style.display = 'none';
                console.error(err);
                alert("Error de red al buscar el tráiler");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.bottom = '40px';
            setTimeout(() => { toast.style.bottom = '-100px'; }, 4000);
        }
    </script>
    <!-- Background Music Player -->
    <div style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
        <img id="music-disc" onclick="toggleMusic()" src="/static/sonidos-logo/channels4_profile.jpg" alt="Disc" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid #53ff45; box-shadow: 0 0 10px rgba(83,255,69,0.3); transition: all 0.3s; opacity: 0.5; cursor: pointer;">
        <div id="bg-music-player" style="opacity: 0.1; transition: opacity 0.3s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.1"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let ytPlayer;
        let isMusicPlaying = false;
        let clickHandlerAdded = false;

        function onYouTubeIframeAPIReady() {
            fetch('/api/youtube/channel_music')
                .then(res => res.json())
                .then(data => {
                    const videos = data.videos || ['BsuFR4OR8sQ'];
                    const firstVideo = videos[0];
                    const playlistStr = videos.join(',');

                    ytPlayer = new YT.Player('bg-music-player', {
                        height: '113',
                        width: '200',
                        videoId: firstVideo,
                        playerVars: {
                            playlist: playlistStr,
                            loop: 1,
                            controls: 1
                        },
                        events: {
                            'onReady': onPlayerReady,
                            'onStateChange': onPlayerStateChange
                        }
                    });
                })
                .catch(err => console.error("Error cargando musica de fondo", err));
        }

        function onPlayerReady(event) {
            event.target.unMute();
            event.target.setVolume(50);
            
            // Wait for user interaction to autoplay
            if (!clickHandlerAdded) {
                document.body.addEventListener('click', () => {
                    if (ytPlayer && typeof ytPlayer.playVideo === 'function' && !isMusicPlaying) {
                        ytPlayer.playVideo();
                    }
                }, { once: true });
                clickHandlerAdded = true;
            }
        }

        function onPlayerStateChange(event) {
            const disc = document.getElementById('music-disc');
            if (event.data == YT.PlayerState.PLAYING) {
                isMusicPlaying = true;
                if(disc) {
                    disc.classList.add('spin-disc');
                    disc.style.opacity = '1';
                }
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                isMusicPlaying = false;
                if(disc) {
                    disc.classList.remove('spin-disc');
                    disc.style.opacity = '0.5';
                }
            }
        }

        function toggleMusic() {
            if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
            if (isMusicPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }
    </script>
</body>
</html>
