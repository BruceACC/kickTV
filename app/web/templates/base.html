<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KickTV — Panel de control para canal de televisión automático 24/7">
    <title>{% block title %}KickTV{% endblock %} — Control Panel</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="bi bi-broadcast"></i>
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">KickTV</span>
                        <span class="brand-tag">24/7 AUTO</span>
                    </div>
                </div>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-label">MAIN</li>
                <li>
                    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}" id="nav-dashboard">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="/queue" class="nav-link {% if request.url.path == '/queue' %}active{% endif %}" id="nav-queue">
                        <i class="bi bi-collection-play-fill"></i>
                        <span>Cola</span>
                        <span class="badge-count" id="queue-badge">0</span>
                    </a>
                </li>
                <li>
                    <a href="/history" class="nav-link {% if request.url.path == '/history' %}active{% endif %}" id="nav-history">
                        <i class="bi bi-clock-history"></i>
                        <span>Historial</span>
                    </a>
                </li>

                <li class="nav-label">MANAGE</li>
                <li>
                    <a href="/providers" class="nav-link {% if request.url.path == '/providers' %}active{% endif %}" id="nav-providers">
                        <i class="bi bi-plug-fill"></i>
                        <span>Proveedores</span>
                    </a>
                </li>
                <li>
                    <a href="/settings" class="nav-link {% if request.url.path == '/settings' %}active{% endif %}" id="nav-settings">
                        <i class="bi bi-gear-fill"></i>
                        <span>Configuración</span>
                    </a>
                </li>
                <li>
                    <a href="/logs" class="nav-link {% if request.url.path == '/logs' %}active{% endif %}" id="nav-logs">
                        <i class="bi bi-terminal-fill"></i>
                        <span>Logs</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="stream-indicator" id="stream-indicator">
                    <span class="status-dot" id="status-dot"></span>
                    <span class="status-label" id="status-label">Offline</span>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <button class="btn btn-link sidebar-toggle d-md-none" id="sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-info">
                    <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                <div class="topbar-actions">
                    <div class="stream-controls">
                        <button class="btn btn-control btn-start" id="btn-start" onclick="controlStream('start')" title="Iniciar Stream">
                            <i class="bi bi-play-fill"></i>
                        </button>
                        <button class="btn btn-control btn-stop" id="btn-stop" onclick="controlStream('stop')" title="Detener Stream">
                            <i class="bi bi-stop-fill"></i>
                        </button>
                        <button class="btn btn-control btn-restart" id="btn-restart" onclick="controlStream('restart')" title="Reiniciar Stream">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container">
        <div id="app-toast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- App JS -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
