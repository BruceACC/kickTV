{% extends "base.html" %}

{% block title %}Logs{% endblock %}
{% block page_title %}Visor de Logs{% endblock %}

{% block content %}
<div class="page-content">
    <div class="page-actions mb-3">
        <div class="btn-group" role="group">
            <button class="btn btn-sm btn-outline-light active" onclick="filterLogs('all', this)" id="filter-all">Todos</button>
            <button class="btn btn-sm btn-outline-info" onclick="filterLogs('INFO', this)">Info</button>
            <button class="btn btn-sm btn-outline-warning" onclick="filterLogs('WARNING', this)">Warning</button>
            <button class="btn btn-sm btn-outline-danger" onclick="filterLogs('ERROR', this)">Error</button>
        </div>
        <button class="btn btn-sm btn-outline-secondary ms-2" onclick="clearLogs()">
            <i class="bi bi-trash"></i> Limpiar
        </button>
        <label class="form-check form-switch d-inline-flex align-items-center ms-3">
            <input class="form-check-input" type="checkbox" id="log-autoscroll" checked>
            <span class="form-check-label ms-1 small">Auto-scroll</span>
        </label>
    </div>

    <div class="card glass-card">
        <div class="card-body p-0">
            <div class="log-terminal" id="log-terminal">
                <div class="log-empty" id="log-empty">
                    <i class="bi bi-terminal"></i>
                    <p>Conectando al stream de logs...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let logFilter = 'all';
let logWs = null;

document.addEventListener('DOMContentLoaded', connectLogWs);

function connectLogWs() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    logWs = new WebSocket(`${protocol}//${window.location.host}/ws/logs`);

    logWs.onopen = () => {
        document.getElementById('log-empty').style.display = 'none';
    };

    logWs.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'initial') {
            msg.data.forEach(entry => appendLogLine(entry));
        } else if (msg.type === 'log') {
            appendLogLine(msg.data);
        }
    };

    logWs.onclose = () => {
        setTimeout(connectLogWs, 3000);
    };
}

function appendLogLine(entry) {
    const terminal = document.getElementById('log-terminal');
    const line = document.createElement('div');
    line.className = `log-line log-${entry.level?.toLowerCase() || 'info'}`;
    line.dataset.level = entry.level || 'INFO';

    const time = entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString('es') : '';
    line.innerHTML = `<span class="log-time">${time}</span>` +
        `<span class="log-level">${entry.level || 'INFO'}</span>` +
        `<span class="log-module">[${entry.module || 'app'}]</span>` +
        `<span class="log-msg">${escapeHtml(entry.message || '')}</span>`;

    if (logFilter !== 'all' && entry.level !== logFilter) {
        line.style.display = 'none';
    }

    terminal.appendChild(line);

    // Keep max 1000 lines
    while (terminal.children.length > 1000) {
        terminal.removeChild(terminal.firstChild);
    }

    // Auto-scroll
    if (document.getElementById('log-autoscroll').checked) {
        terminal.scrollTop = terminal.scrollHeight;
    }
}

function filterLogs(level, btn) {
    logFilter = level;
    document.querySelectorAll('.page-actions .btn-group .btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    document.querySelectorAll('.log-line').forEach(line => {
        if (level === 'all' || line.dataset.level === level) {
            line.style.display = '';
        } else {
            line.style.display = 'none';
        }
    });
}

function clearLogs() {
    const terminal = document.getElementById('log-terminal');
    terminal.innerHTML = '';
}
</script>
{% endblock %}
