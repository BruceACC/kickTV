{% extends "base.html" %}

{% block title %}Cola de Reproducción{% endblock %}
{% block page_title %}Cola de Reproducción{% endblock %}

{% block content %}
<div class="page-content">
    <div class="page-actions mb-4">
        <button class="btn btn-primary" onclick="fillQueue()">
            <i class="bi bi-plus-circle"></i> Rellenar Cola
        </button>
        <button class="btn btn-outline-danger" onclick="clearQueue()">
            <i class="bi bi-trash"></i> Vaciar Cola
        </button>
        <button class="btn btn-outline-secondary" onclick="loadQueue()">
            <i class="bi bi-arrow-clockwise"></i> Refrescar
        </button>
    </div>

    <div class="card glass-card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="card-title mb-0"><i class="bi bi-collection-play-fill"></i> Videos en Cola</h2>
                <span class="badge bg-primary fs-6" id="queue-count">0 videos</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom" id="queue-table">
                    <thead>
                        <tr>
                            <th width="50">#</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Categoría</th>
                            <th>Proveedor</th>
                            <th>Duración</th>
                        </tr>
                    </thead>
                    <tbody id="queue-body">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Cola vacía
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', loadQueue);

async function loadQueue() {
    try {
        const resp = await fetch('/api/queue');
        const data = await resp.json();
        const items = data.data?.items || [];
        const tbody = document.getElementById('queue-body');
        document.getElementById('queue-count').textContent = `${items.length} videos`;

        if (items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>Cola vacía</td></tr>`;
            return;
        }

        tbody.innerHTML = items.map((item, i) => `
            <tr class="queue-row">
                <td><span class="queue-pos">${i + 1}</span></td>
                <td class="fw-medium">${escapeHtml(item.title || 'Sin título')}</td>
                <td>${escapeHtml(item.author || '—')}</td>
                <td><span class="category-badge">${item.category || '—'}</span></td>
                <td><span class="provider-badge provider-${item.provider}">${item.provider || '—'}</span></td>
                <td>${formatDuration(item.duration || 0)}</td>
            </tr>
        `).join('');
    } catch (e) {
        console.error('Error loading queue:', e);
    }
}

async function fillQueue() {
    try {
        const resp = await fetch('/api/queue/fill', { method: 'POST' });
        const data = await resp.json();
        showToast(data.message || 'Cola rellenada', 'success');
        setTimeout(loadQueue, 1000);
    } catch (e) {
        showToast('Error al rellenar la cola', 'danger');
    }
}

async function clearQueue() {
    if (!confirm('¿Seguro que deseas vaciar la cola?')) return;
    try {
        const resp = await fetch('/api/queue/clear', { method: 'POST' });
        const data = await resp.json();
        showToast(data.message || 'Cola vaciada', 'warning');
        loadQueue();
    } catch (e) {
        showToast('Error al vaciar la cola', 'danger');
    }
}
</script>
{% endblock %}
